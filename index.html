<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/tailwindcss/dist/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>Tony Luo</title>
  <script src="script.js" defer></script>
</head>

<body class="container lg:text-xl lg:max-w-screen-lg lg:mx-auto">
  <!-- Artist Profile -->
  <section id="profile">
    <div class="container mx-auto px-4 py-8 lg:pt-12 lg:pb-24 text-center">
      <!-- img class="h-32 md:h-48 mx-auto mb-3 rounded-full flex justify-center items-center" src="assets/profile.jpg" alt="avatar" / -->
      <h2 class="text-4xl font-bold mb-2">About the author</h2>
      <h3 class="text-xl mb-4">My name is Tony Luo.</h3>
    </div>
  </section>
  <!-- works -->
  <section id="works">
    <div class="container mx-auto px-4 py-8 md:pt-24 md:pb-12 flex flex-wrap justify-center items-center">
      <div class="max-w-sm md:max-w-md overflow-hidden border border-gray-400 rounded-b m-2 hover:shadow-xl hover:underline image-card">
        <div>
          <img class="w-full" src="assets/works/chicago.jpg" alt="image" />
          <div class="w-full px-6 py-4 text-center">
            <p class="font-bold text-base">Chicago</p>
          </div>
        </div>
      </div>
      <div class="max-w-sm md:max-w-md overflow-hidden border border-gray-400 rounded-b m-2 hover:shadow-xl hover:underline image-card">
        <div>
          <img class="w-full" src="assets/works/modern-cyclops.jpg" alt="image" />
          <div class="px-6 py-4 text-center">
            <p class="font-bold text-base">Modern Cyclops</p>
          </div>
        </div>
      </div>
      <div class="max-w-sm md:max-w-md overflow-hidden border border-gray-400 rounded-b m-2 hover:shadow-xl hover:underline image-card">
        <div>
          <img class="w-full" src="assets/works/pineapple-blue.jpg" alt="image" />
          <div class="px-6 py-4 text-center">
            <p class="font-bold text-base">Pineapple blue</p>
          </div>
        </div>
      </div>
      <div class="max-w-sm md:max-w-md overflow-hidden border border-gray-400 rounded-b m-2 hover:shadow-xl hover:underline image-card">
        <div>
          <img class="w-full" src="assets/works/moutains.jpg" alt="image" />
          <div class="px-6 py-4 text-center">
            <p class="font-bold text-base">The Coldest Sunset</p>
          </div>
        </div>
      </div>
      <div class="max-w-sm md:max-w-md overflow-hidden border border-gray-400 rounded-b m-2 hover:shadow-xl hover:underline image-card">
        <div>
          <img class="w-full" src="assets/works/coney-island-grafitti.jpg" alt="image" />
          <div class="px-6 py-4 text-center">
            <p class="font-bold text-base">Grafitti at Coney Island</p>
          </div>
        </div>
      </div>
      <div class="max-w-sm md:max-w-md overflow-hidden border border-gray-400 rounded-b m-2 hover:shadow-xl hover:underline image-card">
        <div>
          <img class="w-full" src="assets/works/the-van-gogh-selfie.jpg" alt="image" />
          <div class="px-6 py-4 text-center">
            <p class="font-bold text-base">The van Gogh selfie</p>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- Footer -->
  <footer>
    <div class="container flex flex-col sm:flex-row sm:flex-wrap justify-between items-center mx-auto mb-6 px-4 text-sm">
      <p class="uppercase">©2026 Tony Luo</p>
    </div>
  </footer>
</body>
</html>
